spring.application.name=safetrip

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safetrip}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:safetrip}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:safetrip123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:SafeTripJwtSecretKeyForMvpVersion2026SecureEnough123456}
app.security.jwt.expiration-minutes=${APP_SECURITY_JWT_EXPIRATION_MINUTES:1440}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.port=${PORT:8080}
server.address=0.0.0.0

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:3000}

app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.bot-service-url=${TELEGRAM_BOT_SERVICE_URL:http://localhost:8001}
app.telegram.bot-secret=${TELEGRAM_BOT_SECRET:change-me-local-secret}
app.telegram.bind.expiration-minutes=${TELEGRAM_BIND_EXPIRATION_MINUTES:15}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.otp.expiration-minutes=${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:5}
app.password-reset.otp.max-attempts=${PASSWORD_RESET_OTP_MAX_ATTEMPTS:5}
