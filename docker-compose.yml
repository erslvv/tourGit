services:
  postgres:
    image: postgres:16-alpine
    container_name: safetrip-postgres
    environment:
      POSTGRES_DB: safetrip
      POSTGRES_USER: safetrip
      POSTGRES_PASSWORD: safetrip123
    ports:
      - "5432:5432"
    volumes:
      - safetrip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrip -d safetrip"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    container_name: safetrip-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safetrip.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safetrip-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/safetrip
      SPRING_DATASOURCE_USERNAME: safetrip
      SPRING_DATASOURCE_PASSWORD: safetrip123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_SECURITY_JWT_SECRET: SafeTripJwtSecretKeyForDockerLocalRun2026
      APP_SECURITY_JWT_EXPIRATION_MINUTES: 1440
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_SERVICE_URL: ${TELEGRAM_BOT_SERVICE_URL:-http://telegram-bot:8001}
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET:-change-me-local-secret}
      TELEGRAM_BIND_EXPIRATION_MINUTES: ${TELEGRAM_BIND_EXPIRATION_MINUTES:-15}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-15}
      PASSWORD_RESET_OTP_EXPIRATION_MINUTES: ${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:-5}
      PASSWORD_RESET_OTP_MAX_ATTEMPTS: ${PASSWORD_RESET_OTP_MAX_ATTEMPTS:-5}

  frontend:
    build:
      context: ./safetrip-front
      dockerfile: Dockerfile
    container_name: safetrip-frontend
    depends_on:
      - app
    ports:
      - "3000:80"

  telegram-bot:
    profiles: ["telegram"]
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: safetrip-telegram-bot
    depends_on:
      - app
    ports:
      - "8001:8001"
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_SHARED_SECRET: ${TELEGRAM_BOT_SECRET:-change-me-local-secret}
      JAVA_API_BASE_URL: ${JAVA_API_BASE_URL:-http://app:8080}
      PORT: 8001

volumes:
  safetrip_pg_data:
